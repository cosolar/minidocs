# 生产环境：MySQL 8.0
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:3306/minidocs?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: minidocs-mysql
      maximum-pool-size: 20
      minimum-idle: 5

minidocs:
  db-dialect: mysql
