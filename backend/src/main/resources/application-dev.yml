# 开发环境：SQLite 单文件，零外部依赖
spring:
  datasource:
    # busy_timeout 与 journal_mode 是必须的，不是调优项：连接池有 8 条连接，而 SQLite 默认
    # busy_timeout=0 —— 两个写请求撞上（例如连续切两次视图，每次都会 PUT /api/settings）时，
    # 第二条直接 SQLITE_BUSY，接口返回 500。WAL 让读不挡写，5s 的等待窗口让写请求排队而不是报错。
    url: jdbc:sqlite:${VAULT_HOME:./data}/minidocs.db?journal_mode=WAL&busy_timeout=5000
    driver-class-name: org.sqlite.JDBC
    hikari:
      pool-name: minidocs-sqlite
      maximum-pool-size: 8
      minimum-idle: 1
      connection-timeout: 10000

minidocs:
  db-dialect: sqlite
