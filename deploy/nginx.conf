# MiniDocs 前端 + 反向代理（形态 A，见 docs/DEPLOYMENT.md §3.4）
#
# 这份配置随 minidocs-web 镜像分发，是 compose 里的默认站点配置。
# 落地路径：/etc/nginx/conf.d/default.conf

# 本文件被 include 进 http 块，所以 map 可以直接写在这里。
#
# 为什么需要它：容器通常在宿主的 OpenResty 后面，明文 HTTP 进来，$scheme 恒为 http。
# 若直接 proxy_set_header X-Forwarded-Proto $scheme，就会用 http 覆盖掉上游传来的 https，
# 后端按 forward-headers-strategy 采纳后认为自己是 http://站点，
# 与浏览器实际发出的 Origin: https://站点 不一致 → 判定为跨域请求。
# 而 Chrome 对**同源**的 POST 也会带 Origin，于是所有写操作都会 403 Invalid CORS request
# （登录接口首当其冲，读接口因为浏览器不发 Origin 而正常）。
#
# 取舍：优先透传上游的 X-Forwarded-Proto；上游没给（直连容器调试）才退回 $scheme。
# 不在这里把站点域名写死成白名单——同源请求本来就不走 CORS 检查，
# 放行反而会掩盖「反代没传对 scheme」这类配置错误。
map $http_x_forwarded_proto $minidocs_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream minidocs_backend {
    # compose 网络内的服务名；独立部署时改成 127.0.0.1:9098
    server app:9098;
    keepalive 32;
}

server {
    listen 80;
    # 用 IP:端口直接访问时保持 _ 即可；绑了域名后把这里换成域名并加一段 443 的 server
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 必须 >= 后端 spring.servlet.multipart.max-request-size(60MB)，否则大文件在到达后端前就被 413
    client_max_body_size 60m;

    access_log /var/log/nginx/minidocs.access.log;
    error_log  /var/log/nginx/minidocs.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # 安全响应头。
    # 注意：后端的 SecurityHeaderFilter 只对「经过 Spring 的响应」生效，而这里的 index.html 与
    # /assets/* 是 Nginx 直接吐的，Java 侧管不到，所以同样的头必须在 Nginx 补一份。
    #
    # img-src 的 https: 不能漏：知识库要读别人写的文档，markdown 里的外链图片（自建图床、
    # img.shields.io 徽章）是常态。少了它，浏览器会按「已屏蔽：csp」把图片丢掉 —— 而那条请求
    # 在服务端日志里是 200、Network 面板看着像「跨域被拦」，很容易被误判成 CORS 问题。
    # 收紧办法：去掉 https:，同时把后端 minidocs.csp-allow-external-images 置 false，
    # 两处必须一起改 —— CSP 多条并存时取交集，只改一处不会生效。
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdmirror.com; script-src 'self'; font-src 'self' data: https://cdn.jsdmirror.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1) 接口、库内资源、Swagger、Druid 监控页：后端 context-path 下的一切原样透传
    #    proxy_pass 不带尾斜杠，/minidocs/ 这一段保留给后端自己按 context-path 解析
    location /minidocs/ {
        proxy_pass http://minidocs_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 后端据此把分享链接等对外地址生成成 https://，漏了会全是 http://
        # 用 $minidocs_forwarded_proto 而非 $scheme，原因见文件头的 map 注释
        proxy_set_header X-Forwarded-Proto $minidocs_forwarded_proto;

        proxy_connect_timeout 15s;
        proxy_read_timeout    120s;   # 导入 / 导出 / Git 同步可能较慢
        proxy_send_timeout    120s;
        proxy_request_buffering off; # 50MB 上传走流式，避免先落 Nginx 磁盘
        proxy_buffering       off;
    }

    # 2) 带内容哈希的构建资源：长缓存。
    #    只用 expires 而不在这里写 add_header：Nginx 里子层的 add_header 会「整体替换」父层的，
    #    在这个 location 补 Cache-Control 会把上面那四个安全头一并顶掉。
    location /assets/ {
        expires 365d;
    }

    # 3) SPA 入口页必须每次向服务器校验，且不能只靠启发式缓存。
    #
    #    这里原先没发 Cache-Control，只有 ETag + Last-Modified。浏览器于是套用启发式缓存
    #    （自行按 Last-Modified 距今时长的 10% 定有效期），在有效期内直接用本地副本、
    #    不发条件请求，于是 index.html 里引用的仍是旧 chunk —— 表现就是「发版了但没生效」，
    #    而且每次发版都会重现。
    #
    #    用 expires 而不是 add_header：后者会顶掉上面那四行安全头（Nginx 的 add_header 一旦在
    #    子层出现，父级就不再继承），expires 是独立指令，没有这个副作用。
    location = /index.html {
        expires -1;
    }

    # 4) SPA 深链接回退：没有这行，/share/{token}、/console/{org}/kbs 刷新就 404
    location / {
        # 根级非哈希资源（logo.svg 之类）同样不可缓存：文件名不带内容哈希，
        # 缓存住就等于改不动了。命中 /index.html 的请求会被上面的精确匹配接走。
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
