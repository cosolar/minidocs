name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B -ntp test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      # lockfile 里的 resolved 指向国内镜像，GitHub runner 上统一换回官方源；
      # replace-registry-host=always 会连同自定义 host 一起替换，integrity 仍由 lock 校验。
      - name: Install dependencies
        working-directory: front
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm ci --include=dev

      - name: Build
        working-directory: front
        run: npm run build

  package:
    name: Package jar
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package
        working-directory: backend
        run: mvn -B -ntp -DskipTests package

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: minidocs-jar
          path: backend/target/minidocs.jar
          retention-days: 7
