name: Publish Docker image

# 发布官方单镜像到 Docker Hub：<DOCKERHUB_USERNAME>/minidocs
#
# 触发方式：
#   1) 打 tag 并推送：git tag v1.2.0 && git push origin v1.2.0
#   2) 在 Actions 页面手动 Run workflow
#
# 仓库需要配置两个 Secrets（Settings → Secrets and variables → Actions）：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Docker Hub Access Token（不是登录密码）
#
# 镜像内容见仓库根 Dockerfile：前端打进 jar，后端单进程伺服，默认 SQLite。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 测试不过就不发镜像：防止坏代码覆盖 Docker Hub 上的 latest。
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: mvn -B -ntp test

      # Docker 构建会重新打包前端；这里先单独构建一次，让编译错误在登录/推送之前暴露。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Build frontend
        working-directory: front
        run: |
          npm config set registry https://registry.npmjs.org
          npm config set replace-registry-host always
          npm ci --include=dev
          # 与镜像内一致：单 jar 形态后端 context-path 为空
          VITE_BACKEND_BASE= npm run build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/minidocs
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # 纯 Java + 静态资源；与现有生产服务器架构一致，先只发 amd64。
          # 需要 Apple Silicon / ARM 服务器时改用 linux/amd64,linux/arm64。
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
