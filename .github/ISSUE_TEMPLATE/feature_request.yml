name: 功能建议
description: 提出新功能或体验改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先搜索现有 issue，并说明要解决的问题，而不只是方案本身。
        与产品边界有关的（多租户、文档级 ACL、实时协同等）建议先读
        [权限与功能规范](https://github.com/cosolar/minidocs/blob/main/docs/多租户知识库权限与功能规范.md)。

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 issue，没有重复
          required: true

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 谁在什么场景下遇到了什么困难？现在是怎么绕过的？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      options:
        - 写作 / 编辑器
        - 阅读 / 分享
        - 组织 / 权限
        - 搜索
        - 部署 / 运维
        - 其他
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false
